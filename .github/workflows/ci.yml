# Speech-Therapy CI — 모든 push (main / develop) + PR (main) 시 회귀 자동 검증.
#
# 본 워크플로의 목적:
#   - RewardLog RLS schema drift 같은 사고의 재발 방지 (2026-05-22 SEC-002 sub-session 학습)
#   - 머지 전 자동 게이트 → 브랜치 보호 (별도 GitHub Settings) 와 결합 시 머지 차단
#
# 검증 범위:
#   quality-gate  : tsc --noEmit + eslint + vitest run
#   next-build    : next build (Turbopack chunking / "use server" 룰 위반 사전 차단)
#   e2e-chat      : F15 /chat playwright (게이트 ON, route-mock — 안전 표면 회귀 가드, 2026-06-02 추가)
#   prisma-drift  : prisma migrate status (DB 연결 — secrets 필요)
#
# 범위 외 (의도적 제외):
#   - playwright e2e 전체 (diagnose / onboarding 등) — Vercel preview deploy 후 별도 워크플로
#     (단 F15 /chat e2e 는 안전 표면 회귀 가드로 본 워크플로 e2e-chat job 에 포함)
#
# next-build job 추가 사유 (2026-05-25 §16 sub-session 학습):
#   - vitest + tsc + lint 모두 통과해도 `next build` 가 깨질 수 있음.
#   - 발견 사례: Next.js 16 + Turbopack 의 strict "use server" 룰 (async function 외
#     export 금지) 위반 21건이 vitest + tsc 통과 + main push 까지 무사 통과 → bundle
#     analyze 시도 시점에 발견. Vercel deploy 시 같은 사고 재발 위험.
#   - 비용 trade-off: build job ≈ 2~3분 × 2~3 push/일 = 미미. 사고 1회 = sub-session
#     1~2시간 소요. CI 비용이 압도적으로 저렴.
#
# 트리거:
#   - main / develop 브랜치 push (직접 푸시 후 회귀 검증)
#   - PR (main) — 머지 전 게이트
#   - paths 필터로 docs / 위키 / keep-warm 워크플로 변경 시 스킵
#
# 동시성:
#   - 같은 ref 의 이전 실행은 자동 취소 (rebase / force-push 시 불필요한 실행 방지)
#
# 필요 GitHub Secrets (prisma-drift job 활성화 조건):
#   - DATABASE_URL : Supabase Transaction pooler (?pgbouncer=true, port 6543)
#   - DIRECT_URL   : Supabase Direct connection (port 5432) — prisma migrate 전용
#   secrets 미설정 시 prisma-drift job 은 자동 skip (실패 아님). 등록 방법은 README 참조.

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Speech-Therapy_App/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Speech-Therapy_App/**"
      - ".github/workflows/ci.yml"
  # 수동 트리거 — Actions 탭 "Run workflow" 버튼. 워크플로 자체 변경 검증 + 디버깅용.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate (tsc + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Speech-Therapy_App

    # prisma generate / Server Action 코드가 환경변수 참조 — dummy 로 만족시키되,
    # 실 DB 연결은 발생하지 않음 (테스트는 prisma mock).
    #
    # TZ=Asia/Seoul — 본 프로젝트의 timeline/weekly-report/funnel 등 다수 테스트가
    # local Date 생성자 (`new Date(2026, 4, 23, 14, 30)`) 를 사용하면서 KST 자정 기준
    # `kstStartOfDay` 와 비교. ubuntu-latest 기본 TZ 가 UTC 라 9h offset 으로 today/
    # yesterday 분기가 어긋남 (2026-05-25 §16 sub-session 학습 — timeline-aggregator
    # 테스트 2건 회귀). TZ 고정으로 local Date 가 KST 로 해석되어 일관.
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      GOOGLE_GENERATIVE_AI_API_KEY: "ci-dummy-key"
      TZ: "Asia/Seoul"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 + npm cache
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        run: npm ci

      - name: TypeScript — tsc --noEmit
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest (단위 + 통합 전체)
        run: npm test

  # ---------------------------------------------------------------------------
  # next-build — Turbopack chunking 룰 / "use server" 룰 / client bundle 누출 검증.
  #
  # vitest 가 못 잡는 사고 유형:
  #   - "use server" 파일의 non-async export (const / interface / class) — Turbopack
  #     이 "no exports at all" + chunking failure 로 거부. 2026-05-25 §16 에서 21건
  #     적발.
  #   - Client Component 가 Prisma 를 transitively import (lib/db.ts 가 client bundle
  #     로 끌려가 `node:module` 외부 모듈 미지원 chunking error).
  #   - Server Action 의 type-only re-export 위반 등.
  #
  # 환경:
  #   - 런타임 secret 부재 (dummy 만) — 본 단계는 _컴파일 + chunking_ 만 검증.
  #   - 실 DB / API 호출은 발생 안 함 (모든 page 가 dynamic = "force-dynamic" / RSC
  #     fetch 는 build 시점 실행 안 함).
  #   - prerender 도 dummy env 로 통과 가능 (현 코드 베이스 기준 — 정적 prerender 페이지
  #     중 환경 의존 RSC 없음).
  # ---------------------------------------------------------------------------
  next-build:
    name: next-build (Turbopack 룰 + chunking 검증)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Speech-Therapy_App

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      GOOGLE_GENERATIVE_AI_API_KEY: "ci-dummy-key"
      # Supabase client 모듈이 build 시점에 URL 형식 검증할 수 있어 valid URL shape 제공.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key"
      NEXT_PUBLIC_BASE_URL: "https://ci-dummy.example"
      NEXT_PUBLIC_SITE_URL: "https://ci-dummy.example"
      # TZ 고정 (KST) — quality-gate 와 동일 사유 (build prerender 에서도 TZ 의존
      # 모듈이 평가될 수 있어 안전 측 일관 설정).
      TZ: "Asia/Seoul"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 + npm cache
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        run: npm ci

      - name: Next build (Turbopack — chunking / "use server" 룰 검증)
        run: npx next build

  # ---------------------------------------------------------------------------
  # e2e-chat — F15 /chat 안전 표면 e2e (playwright, 게이트 ON).
  #
  # 2026-06-02: F15 활성 evidence. chat-flow.spec 은 /api/chat/stream 을 page.route 로
  #   canned 스트림 mock → 실 Gemini / auth 불요. F15_CHAT_ENABLED=true 로 runner + 서버 동일
  #   env → ON describe(스트리밍 UI · 401/403 에러 매핑 · CON-04 금칙어 0) 실행, OFF 는 skip.
  # webServer 자동부팅(next dev) 대신 next build + next start 수동 기동(프로덕션 경로 —
  #   로컬 dev 부팅 이슈 회피 + PLAYWRIGHT_BASE_URL 로 playwright 자동 webServer skip).
  #   2026-06-02 로컬 검증 동일 흐름 (next start + PLAYWRIGHT_BASE_URL → ON 10 passed).
  # ---------------------------------------------------------------------------
  e2e-chat:
    name: e2e-chat (F15 /chat playwright, 게이트 ON)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Speech-Therapy_App

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      GOOGLE_GENERATIVE_AI_API_KEY: "ci-dummy-key"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key"
      NEXT_PUBLIC_BASE_URL: "https://ci-dummy.example"
      NEXT_PUBLIC_SITE_URL: "https://ci-dummy.example"
      TZ: "Asia/Seoul"
      # F15 게이트 ON — runner(F15_ENABLED) + 수동 기동 서버 동일 env 로 ON describe 실행.
      F15_CHAT_ENABLED: "true"
      # 외부 baseURL 지정 → playwright 자동 webServer(next dev) skip (아래 next start 수동 기동).
      PLAYWRIGHT_BASE_URL: "http://localhost:4000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 + npm cache
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        run: npm ci

      - name: Install Playwright chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      - name: Next build (prod)
        run: npx next build

      - name: Start prod server + run F15 /chat e2e (gate ON)
        run: |
          npm start &
          SERVER_PID=$!
          # 서버 준비 대기 (최대 60s) — /chat 200 확인.
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/chat >/dev/null 2>&1; then
              echo "server ready after ${i}s"; ready=true; break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::next start 서버가 60s 내 부팅 실패"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          npx playwright test chat-flow --reporter=line
          status=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $status

  # ---------------------------------------------------------------------------
  # prisma-drift — schema.prisma 와 운영 DB 의 migration history 일치 검증.
  # secrets (DATABASE_URL / DIRECT_URL) 미설정 시 자동 skip → 안전한 기본값.
  # 사용자가 GitHub Settings → Secrets and variables → Actions 에 등록 후 활성화.
  # ---------------------------------------------------------------------------
  prisma-drift:
    name: prisma-drift (migrate status)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # secrets 컨텍스트는 job-level if 에서 직접 비교 불가 → env 로 끌어내려 비교.
    # DATABASE_URL secret 이 빈 문자열이거나 미설정이면 job 자체를 skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: Speech-Therapy_App
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Guard — secrets 미설정 시 조기 종료 (정상)
        id: guard
        # working-directory: . — defaults 의 Speech-Therapy_App/ 이 Checkout 전 존재
        # 안 함. Guard 는 cd 불필요한 단순 bash 라 root 에서 실행 (2026-05-26 §16 학습).
        working-directory: .
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.DIRECT_URL }}" ]; then
            echo "::warning::DATABASE_URL / DIRECT_URL secret 미설정 → prisma-drift skip. README CI 섹션 참조하여 등록 후 활성화 가능."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v5

      - name: Setup Node 24 + npm cache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Prisma migrate status (drift 감지 — 실패 시 빌드 fail)
        if: steps.guard.outputs.skip != 'true'
        run: npx prisma migrate status
