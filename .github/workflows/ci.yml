# Speech-Therapy CI — 모든 push (main / develop) + PR (main) 시 회귀 자동 검증.
#
# 본 워크플로의 목적:
#   - RewardLog RLS schema drift 같은 사고의 재발 방지 (2026-05-22 SEC-002 sub-session 학습)
#   - 머지 전 자동 게이트 → 브랜치 보호 (별도 GitHub Settings) 와 결합 시 머지 차단
#
# 검증 범위:
#   quality-gate  : tsc --noEmit + eslint + vitest run
#   prisma-drift  : prisma migrate status (DB 연결 — secrets 필요)
#
# 범위 외 (의도적 제외):
#   - next build / playwright e2e — Vercel CI 가 책임 (이중 비용 회피)
#   - 로컬 next build 는 E: 드라이브 filesystem 한계로 실패 (Linux runner 는 정상)
#
# 트리거:
#   - main / develop 브랜치 push (직접 푸시 후 회귀 검증)
#   - PR (main) — 머지 전 게이트
#   - paths 필터로 docs / 위키 / keep-warm 워크플로 변경 시 스킵
#
# 동시성:
#   - 같은 ref 의 이전 실행은 자동 취소 (rebase / force-push 시 불필요한 실행 방지)
#
# 필요 GitHub Secrets (prisma-drift job 활성화 조건):
#   - DATABASE_URL : Supabase Transaction pooler (?pgbouncer=true, port 6543)
#   - DIRECT_URL   : Supabase Direct connection (port 5432) — prisma migrate 전용
#   secrets 미설정 시 prisma-drift job 은 자동 skip (실패 아님). 등록 방법은 README 참조.

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Speech-Therapy_App/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Speech-Therapy_App/**"
      - ".github/workflows/ci.yml"
  # 수동 트리거 — Actions 탭 "Run workflow" 버튼. 워크플로 자체 변경 검증 + 디버깅용.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate (tsc + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Speech-Therapy_App

    # prisma generate / Server Action 코드가 환경변수 참조 — dummy 로 만족시키되,
    # 실 DB 연결은 발생하지 않음 (테스트는 prisma mock).
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      GOOGLE_GENERATIVE_AI_API_KEY: "ci-dummy-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        run: npm ci

      - name: TypeScript — tsc --noEmit
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest (단위 + 통합 전체)
        run: npm test

  # ---------------------------------------------------------------------------
  # prisma-drift — schema.prisma 와 운영 DB 의 migration history 일치 검증.
  # secrets (DATABASE_URL / DIRECT_URL) 미설정 시 자동 skip → 안전한 기본값.
  # 사용자가 GitHub Settings → Secrets and variables → Actions 에 등록 후 활성화.
  # ---------------------------------------------------------------------------
  prisma-drift:
    name: prisma-drift (migrate status)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # secrets 컨텍스트는 job-level if 에서 직접 비교 불가 → env 로 끌어내려 비교.
    # DATABASE_URL secret 이 빈 문자열이거나 미설정이면 job 자체를 skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: Speech-Therapy_App
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Guard — secrets 미설정 시 조기 종료 (정상)
        id: guard
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.DIRECT_URL }}" ]; then
            echo "::warning::DATABASE_URL / DIRECT_URL secret 미설정 → prisma-drift skip. README CI 섹션 참조하여 등록 후 활성화 가능."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node 24 + npm cache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Speech-Therapy_App/package-lock.json

      - name: Install dependencies (npm ci, postinstall prisma generate)
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Prisma migrate status (drift 감지 — 실패 시 빌드 fail)
        if: steps.guard.outputs.skip != 'true'
        run: npx prisma migrate status
